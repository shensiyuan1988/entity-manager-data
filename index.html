<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>事项数据管理系统</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pri:#1a73e8;--pri-l:#e8f0fe;--pri-d:#1557b0;
  --bg:#f5f7fa;--card:#fff;--border:#dfe3e8;
  --t1:#202124;--t2:#5f6368;--t3:#9aa0a6;
  --ok:#34a853;--warn:#f9ab00;--err:#ea4335;
  --r:8px;--shadow:0 1px 3px rgba(0,0,0,.08);
  --sidebar-w:320px;
}
html{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t1);height:100%;display:flex;flex-direction:column;overflow:hidden;line-height:1.5}
a{color:var(--pri);text-decoration:none}
a:hover{text-decoration:underline}

/* === Header === */
.app-header{background:var(--pri);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.app-header h1{font-size:17px;font-weight:600;white-space:nowrap}
.app-header .stats{font-size:12px;opacity:.85;margin-left:auto;white-space:nowrap}

/* === Layout === */
.app-body{display:flex;flex:1;overflow:hidden}

/* === Sidebar === */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.search-box{padding:10px 12px;border-bottom:1px solid var(--border)}
.search-box{position:relative}
.search-box::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none;opacity:.5}
.search-box input{width:100%;padding:7px 12px 7px 32px;border:1px solid var(--border);border-radius:20px;font-size:13px;outline:none;background:var(--bg);transition:border-color .2s}
.search-box input:focus{border-color:var(--pri);background-color:#fff}
.filter-bar{display:flex;gap:4px;padding:6px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.fbtn{padding:3px 10px;border:1px solid var(--border);border-radius:12px;font-size:11px;background:#fff;cursor:pointer;color:var(--t2);transition:all .15s;white-space:nowrap}
.fbtn:hover{border-color:var(--pri);color:var(--pri)}
.fbtn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.item-list{flex:1;overflow-y:auto;overflow-x:hidden}
.item-row{padding:8px 14px;cursor:pointer;border-bottom:1px solid #f2f2f2;transition:background .12s}
.item-row:hover{background:var(--pri-l)}
.item-row.sel{background:var(--pri-l);border-left:3px solid var(--pri);padding-left:11px}
.item-row .iname{font-size:13px;font-weight:500;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-row .imeta{font-size:11px;color:var(--t3);margin-top:3px;display:flex;gap:8px}
.item-row .imeta .has{color:var(--ok)}
.pag{padding:6px 12px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:2px;flex-shrink:0}
.pag button{padding:3px 7px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;font-size:11px;color:var(--t2)}
.pag button:hover{background:var(--pri-l)}
.pag button.cur{background:var(--pri);color:#fff;border-color:var(--pri)}
.pag button:disabled{opacity:.35;cursor:default}

/* === Content === */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.cnt-header{padding:14px 20px 0;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.cnt-title{font-size:15px;font-weight:600;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt-sub{font-size:12px;color:var(--t2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:0;margin-top:10px}
.tab{padding:7px 18px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--t2);transition:all .12s;white-space:nowrap;display:flex;align-items:center;gap:4px}
.tab:hover{color:var(--pri)}
.tab.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:500}
.tab .bdg{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:9px;font-size:10px;font-weight:600;padding:0 5px}
.bdg-y{background:var(--pri-l);color:var(--pri)}
.bdg-n{background:#f0f0f0;color:var(--t3)}
.tab-body{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--card);padding:16px 20px}

/* === Action Bar === */
.act-bar{padding:10px 20px;background:var(--card);border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.btn{padding:6px 14px;border-radius:var(--r);font-size:12px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--t1);transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.btn:hover{background:#f5f5f5}
.btn-p{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn-p:hover{background:var(--pri-d)}
.btn:disabled{opacity:.5;cursor:default}

/* === Empty === */
.empty{text-align:center;padding:60px 20px;color:var(--t3)}
.empty .ei{font-size:40px;margin-bottom:12px;opacity:.5}
.empty .et{font-size:13px}

/* === 受理条件 === */
.cond-orig{margin-bottom:14px;padding:10px 14px;background:#f0f4f8;border-radius:var(--r);border-left:3px solid var(--pri)}
.cond-orig-label{font-size:11px;color:var(--t3);margin-bottom:2px}
.cond-orig-text{font-size:13px;line-height:1.6}
.cond-meta{margin-bottom:10px;padding:8px 12px;background:#f8fafc;border-radius:var(--r);display:flex;gap:8px;align-items:baseline;font-size:12px}
.cm-label{color:var(--t3);font-weight:500;white-space:nowrap}
.cm-val{color:var(--t1);line-height:1.5}
.sc-stats{padding:8px 12px;background:#fafbfc;border-bottom:1px solid #f0f0f0;display:flex;gap:12px;flex-wrap:wrap;font-size:11px}
.sc-stat{color:var(--t2);display:flex;align-items:center;gap:3px}
.sc-stat b{color:var(--t1);font-weight:600}
.sc-stat.dr b{color:#0d7a3e}
.sc-stat.mj b{color:#b35c00}
.sc-stat.rel{margin-left:auto;color:var(--t3)}
.sc-stat.rel b{color:var(--pri);font-size:12px}
.sc-logic{padding:8px 12px;margin:0;background:#f5f8fb;border-top:1px solid #f0f0f0;font-size:12px;display:flex;gap:8px;align-items:baseline}
.sl-label{color:var(--t3);font-weight:500;white-space:nowrap}
.sl-val{font-family:'Menlo','Consolas',monospace;font-size:12px;color:var(--pri);font-weight:500}
.sc-action{padding:8px 12px;background:#e8f5e9;border-top:1px solid #c8e6c9;font-size:12px;display:flex;gap:8px;align-items:baseline}
.sa-label{color:#2e7d32;font-weight:500;white-space:nowrap}
.sa-val{color:#1b5e20;font-weight:600}
.sc-card{border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.sc-hd{padding:10px 14px;background:#f5f8fb;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sc-name{font-size:13px;font-weight:500}
.sc-tog{font-size:11px;color:var(--t3);cursor:pointer;user-select:none}
.sc-tog:hover{color:var(--pri)}
.cd-row{padding:8px 14px;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid #f5f5f5}
.cd-row:last-child{border-bottom:none}
.cd-idx{width:22px;height:22px;border-radius:50%;background:var(--pri-l);color:var(--pri);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.cd-body{flex:1;min-width:0}
.cd-desc{font-size:13px;line-height:1.5}
.cd-tags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.cd-tag{font-size:11px;padding:1px 7px;border-radius:10px;white-space:nowrap}
.cd-tag.dr{background:#e6f4ea;color:#137333}
.cd-tag.nd{background:#fce8e6;color:#c5221f}
.cd-tag.info{background:#f0f0f0;color:var(--t2)}
.cd-tag.note{background:#fff3e0;color:#e65100}
.cd-notes-display{margin-top:6px;padding:6px 10px;background:#fff8e1;border-left:3px solid #ffb300;border-radius:4px;font-size:12px;color:#5d4037;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.cnt-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cnt-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:var(--pri-l);color:var(--pri);font-weight:500}
.mat-tbl,.res-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.mat-tbl th,.mat-tbl td,.res-tbl th,.res-tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
.mat-tbl th,.res-tbl th{background:#f8f9fa;font-weight:600;color:var(--t2);font-size:11px;white-space:nowrap;position:sticky;top:0}
.mat-tbl tr:hover,.res-tbl tr:hover{background:#f8f9fa}
.mat-type{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:500}
.mat-type-necessary{background:#fce4ec;color:#c62828}
.mat-type-optional{background:#e8f5e9;color:#2e7d32}
.res-type{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;background:#e3f2fd;color:#1565c0}
.info-card{background:#f8f9fa;border-radius:var(--r);padding:12px 16px;margin-bottom:16px;border:1px solid var(--border)}
.info-card-row{display:flex;gap:12px;margin-bottom:6px;font-size:12px;line-height:1.5}
.info-card-row:last-child{margin-bottom:0}
.info-card-label{color:var(--t2);min-width:80px;flex-shrink:0}
.info-card-value{color:var(--t1);word-break:break-word}
.cd-row.cd-edit{border:1px solid #e8e8e8;border-radius:8px;padding:12px 14px;margin-bottom:8px;background:#fafbfc}
.cd-edit-row{margin-bottom:6px}
.cd-edit-row label{display:block;font-size:11px;color:var(--t3);margin-bottom:3px;font-weight:500}
.cd-edit-row textarea{width:100%;border:1px solid #d9d9d9;border-radius:6px;padding:6px 8px;font-size:13px;line-height:1.5;resize:vertical;font-family:inherit;box-sizing:border-box}
.cd-edit-row textarea:focus,.cd-edit-row input:focus{outline:none;border-color:var(--pri)}
.cd-edit-row input[type="text"]{width:100%;border:1px solid #d9d9d9;border-radius:6px;padding:5px 8px;font-size:12px;box-sizing:border-box}
.cd-edit-inline{display:flex;gap:12px;align-items:center}
.cd-edit-inline label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--t2);margin-bottom:0}
.cd-edit-inline input[type="checkbox"]{accent-color:var(--pri)}
.cd-edit-inline input[type="text"]{flex:1}
.btn-del{background:#fff1f0;color:#cf1322;border:1px solid #ffa39e;font-size:11px;padding:2px 10px;border-radius:6px;cursor:pointer}
.btn-del:hover{background:#cf1322;color:#fff}

/* === 政策依据 === */
.reg-intro{font-size:12px;color:var(--t2);margin-bottom:10px}
.reg-card{border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.reg-hd{padding:10px 14px;background:#fff;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .12s;flex-wrap:wrap}
.reg-hd:hover{background:#fafbfc}
.reg-hd .rn{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reg-hd .rd{font-size:11px;color:var(--t3);flex-shrink:0}
.reg-hd .ra{font-size:12px;color:var(--t3);transition:transform .2s;flex-shrink:0}
.reg-hd .ra.open{transform:rotate(90deg)}
.reg-status{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:500}
.reg-status.valid{background:#e6f4ea;color:#137333}
.reg-status.other{background:#f0f0f0;color:var(--t2)}
.reg-bd{display:none;padding:0;border-top:1px solid #f0f0f0;background:#fafbfc}
.reg-bd.open{display:block}
.reg-meta-bar{padding:10px 14px;display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid #eee;background:#f8fafc}
.reg-meta-item{font-size:11px;color:var(--t2);display:flex;align-items:center;gap:3px}
.reg-meta-item strong{color:var(--t1);font-weight:500}
.reg-section{padding:10px 14px}
.reg-section-title{font-size:12px;font-weight:600;color:var(--pri);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.reg-section-title::before{content:'';display:inline-block;width:3px;height:12px;background:var(--pri);border-radius:2px}
.ref-clause{padding:8px 10px;background:#fff;border-radius:6px;margin-bottom:6px;border-left:3px solid var(--pri)}
.ref-clause-num{font-size:11px;font-weight:600;color:var(--pri);margin-bottom:2px}
.ref-clause-content{font-size:13px;line-height:1.6;color:var(--t1)}
.ref-clause-edit{padding:10px 12px;background:#f8f9ff;border:1px solid #e0e4f0;border-radius:8px;margin-bottom:8px}
.ref-clause-edit-row{display:grid;grid-template-columns:60px 1fr 70px 1fr;gap:6px;align-items:center}
.ref-clause-edit-row label{font-size:11px;color:var(--t3);font-weight:500}
.reg-inp-cn,.reg-inp-cc{border:1px solid #d9d9d9;border-radius:5px;padding:4px 8px;font-size:12px;width:100%;box-sizing:border-box}
.reg-inp-cn:focus,.reg-inp-cc:focus{outline:none;border-color:var(--pri)}
.reg-article{padding:8px 10px;border-bottom:1px solid #f0f0f0}
.reg-article:last-child{border-bottom:none}
.reg-article.highlight{background:#fffbe6;border-left:3px solid var(--warn)}
.reg-json-block{margin:0 14px 14px;padding:12px;background:#1e1e2e;color:#cdd6f4;border-radius:8px;font-family:'Menlo','Consolas','Courier New',monospace;font-size:11px;line-height:1.5;overflow-x:auto;white-space:pre-wrap;word-break:break-all;max-height:500px;overflow-y:auto}
.reg-json-block .json-key{color:#89b4fa}
.reg-json-block .json-str{color:#a6e3a1}
.reg-json-block .json-num{color:#fab387}
.reg-json-block .json-bool{color:#cba6f7}
.reg-json-block .json-null{color:#6c7086}
.reg-json-block .json-highlight{background:rgba(250,204,21,0.15);display:inline}
.reg-article-title{font-size:12px;color:var(--t1);margin-bottom:2px}
.reg-article-content{font-size:12px;line-height:1.5;color:var(--t2)}
.reg-article-type{display:inline-block;padding:0 5px;border-radius:6px;font-size:10px;background:#f0f0f0;color:var(--t2);margin-left:6px}
.reg-article-note{margin-top:4px;padding:6px 8px;background:#f5f5f5;border-radius:4px;font-size:11px;color:var(--t2);line-height:1.5}
.reg-toggle-articles{padding:8px 14px;text-align:center;cursor:pointer;font-size:12px;color:var(--pri);border-top:1px solid #f0f0f0}
.reg-toggle-articles:hover{background:var(--pri-l)}
.reg-source-link{font-size:11px;color:var(--pri)}

/* === 申请表 === */
.fm-info{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.fm-info span{font-size:12px;color:var(--t2)}
.fm-info strong{color:var(--t1);font-weight:500}
.fm-note{display:flex;align-items:flex-start;gap:8px;padding:10px 14px;background:#fff8e1;border:1px solid #ffe082;border-radius:8px;margin-bottom:14px;font-size:13px;color:#5d4037;line-height:1.5}
.fm-note.empty{background:#f5f5f5;border-color:#e0e0e0;color:var(--t3)}
.fm-note-icon{font-size:16px;flex-shrink:0;line-height:1.3}
.fm-note-text{flex:1;white-space:pre-wrap;word-break:break-word}
.fm-note-edit{flex-shrink:0;padding:2px 10px;font-size:11px;background:#fff;border:1px solid #ffe082;border-radius:4px;color:#f57c00;cursor:pointer;transition:all .15s}
.fm-note-edit:hover{background:#fff3e0;border-color:#ffb74d}
.note-wrap{padding:8px 0;max-width:780px;margin:0 auto}
.note-section{margin-bottom:16px;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}
.note-section-hd{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:13px;font-weight:600;color:#fff}
.note-section-hd.pre{background:#6366f1}
.note-section-hd.post{background:#059669}
.note-section-hd.form-tip{background:#d97706}
.note-section-hd.other{background:#6b7280}
.note-section-body{padding:12px 16px;font-size:13px;line-height:1.8;color:var(--t2);white-space:pre-wrap;word-break:break-word;background:#fafafa}
.note-section-body.empty-hint{color:var(--t3);font-style:italic}
.note-edit-section{margin-bottom:14px}
.note-edit-section label{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:4px}
.note-edit-section textarea{width:100%;border:1px solid #d1d5db;border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.6;resize:vertical;font-family:inherit}
.field-filter-bar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;padding:8px 12px;background:#f8f9fa;border-radius:8px;border:1px solid #e9ecef}
.field-filter-group{display:flex;align-items:center;gap:4px}
.field-filter-group label{font-size:11px;color:var(--t2);white-space:nowrap;font-weight:500}
.field-filter-group select{border:1px solid #d0d5dd;border-radius:5px;padding:3px 6px;font-size:11px;background:#fff;color:var(--t1);max-width:140px;cursor:pointer}
.field-filter-group select:focus{outline:none;border-color:var(--pri)}
.field-filter-reset{font-size:11px;padding:3px 10px;border:1px solid #d0d5dd;border-radius:5px;background:#fff;color:var(--t2);cursor:pointer}
.field-filter-reset:hover{background:#f0f0f0}
.ftbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.ftbl{width:100%;border-collapse:collapse;font-size:12px;min-width:700px}
.ftbl th{background:#f0f4f8;padding:7px 10px;text-align:left;font-weight:500;color:var(--t2);border-bottom:2px solid var(--border);position:sticky;top:0;z-index:1;white-space:nowrap}
.ftbl td{padding:7px 10px;border-bottom:1px solid #f0f0f0;vertical-align:top}
.ftbl tr:hover td{background:#fafbfc}
.ftbl .fn{font-weight:500}
.ttag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap}
.ttag.text{background:#e8f0fe;color:#1a73e8}
.ttag.number{background:#e6f4ea;color:#137333}
.ttag.date{background:#fef7e0;color:#b06000}
.ttag.select{background:#f3e8fd;color:#7627bb}
.ttag.textarea{background:#e8f0fe;color:#1a73e8}
.ttag.attachment{background:#fce8e6;color:#c5221f}
.ttag.signature{background:#fff3e0;color:#e65100}
.ttag.image{background:#e0f7fa;color:#00838f}
.req-y{color:var(--err);font-weight:500}
.req-n{color:var(--t3)}

/* === Dimension Tags === */
.dtag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap;margin:2px 1px;line-height:1.4;cursor:default;border:1px solid transparent}
.dtag.主体{background:#e8f0fe;color:#1a73e8;border-color:#1a73e830}
.dtag.客体{background:#e6f4ea;color:#0d7a3e;border-color:#0d7a3e30}
.dtag.空间{background:#e0f7fa;color:#00708a;border-color:#00708a30}
.dtag.凭证{background:#fff3e0;color:#b35c00;border-color:#b35c0030}
.dtag.载体{background:#f3e8fd;color:#7b1fa2;border-color:#7b1fa230}
.dtag .di{font-size:11px;line-height:1}
#dim-tip{position:fixed;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:10px 16px;border-radius:10px;font-size:12px;font-weight:400;pointer-events:none;opacity:0;transition:opacity .15s;z-index:99999;max-width:300px;line-height:1.7;box-shadow:0 8px 24px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08)}
#dim-tip .dt-title{font-weight:600;font-size:13px;margin-bottom:2px}
#dim-tip .dt-desc{opacity:.85;font-size:11px}
#dim-tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#16213e}
.dim-cell{display:flex;flex-wrap:wrap;align-items:center;gap:2px;min-width:90px}

/* === Modal === */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;width:520px;max-width:92vw;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal-hd{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-hd h3{font-size:14px;font-weight:600}
.modal-x{width:26px;height:26px;border:none;background:none;font-size:17px;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.modal-x:hover{background:#f0f0f0}
.modal-bd{padding:16px 18px;overflow-y:auto;flex:1}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:12px;font-weight:500;color:var(--t2);margin-bottom:3px}
.fg input,.fg select,.fg textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;outline:none;font-family:inherit}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--pri)}
.modal-ft{padding:10px 18px;border-top:1px solid var(--border);display:flex;gap:6px;justify-content:flex-end}

/* === Toast === */
.toast{position:fixed;top:16px;right:16px;padding:10px 18px;background:#323232;color:#fff;border-radius:var(--r);font-size:13px;z-index:9999;opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--err)}

/* === Responsive === */
@media(max-width:768px){
  .sidebar{width:100%;min-width:0;max-height:40vh;border-right:none;border-bottom:1px solid var(--border)}
  .app-body{flex-direction:column}
  .cnt-title{font-size:14px}
  .tab{padding:6px 12px;font-size:12px}
}

/* === Print === */
@media print{
  .sidebar,.search-box,.filter-bar,.pag,.act-bar,.tabs,.modal-bg,.toast{display:none!important}
  .app-body{display:block}
  .content{overflow:visible}
  .tab-body{overflow:visible;padding:0}
  .sc-bd,.reg-bd{display:block!important}
  body{background:#fff}
}

<script>
(function(){
'use strict';
var SUPA_URL='https://yhoiagabsftraufbinpa.supabase.co';
var SUPA_KEY='sb_publishable_ngi2NNLWbWH92hTD_kLLJA_lTJQC3d9';
var PS=30;
var TM={text:'文本',number:'数字',date:'日期',select:'下拉选择',textarea:'多行文本',attachment:'附件上传',signature:'签名',image:'图片'};
var EM={'自然人':'自然人','法人/企业':'法人/企业','社会组织':'社会组织','事业单位':'事业单位','其他':'其他','表单/申请':'表单/申请','空间/地址':'空间/地址','项目/事项':'项目/事项','证照/许可':'证照/许可','凭证':'凭证'};
var EM_KEYS=['自然人','法人/企业','社会组织','事业单位','其他','表单/申请','空间/地址','项目/事项','证照/许可','凭证'];
var EM_COLORS={'自然人':'#1a73e8','法人/企业':'#e8710a','社会组织':'#9c27b0','事业单位':'#00897b','其他':'#78909c','表单/申请':'#6d4c9f','空间/地址':'#0d8050','项目/事项':'#c5221f','证照/许可':'#1a9da0','凭证':'#b35c00'};
var items=[],filtered=[],cur=null,curTab=0,curF='all',page=1;
var fieldFilter={type:'',std:'',ent:'',dim:''};
window.fieldFilter=fieldFilter;
var localEdits={};
var STORAGE_KEY='entity_mgr_edits_v1';
var useSupabase=true; // 尝试使用Supabase存储

// 从Supabase加载编辑数据
function loadEditsFromSupabase(){
  if(!useSupabase||!SUPA_KEY)return Promise.resolve({});
  return fetch(SUPA_URL+'/rest/v1/item_edits?select=item_code,edit_data',{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
  }).then(function(r){
    if(!r.ok)throw new Error('Supabase查询失败');
    return r.json();
  }).then(function(rows){
    var edits={};
    for(var i=0;i<rows.length;i++){
      edits[rows[i].item_code]=rows[i].edit_data;
    }
    return edits;
  }).catch(function(e){
    console.warn('Supabase加载失败，使用localStorage:',e.message);
    useSupabase=false;
    return loadLocalEdits();
  });
}

// 保存编辑到Supabase
function saveEditToSupabase(itemCode,editData){
  if(!useSupabase||!SUPA_KEY)return Promise.resolve();
  var headers={
    'apikey':SUPA_KEY,
    'Content-Type':'application/json',
    'Authorization':'Bearer '+SUPA_KEY,
    'Prefer':'return=minimal'
  };
  // 先尝试更新，如果不存在则插入
  return fetch(SUPA_URL+'/rest/v1/item_edits?item_code=eq.'+encodeURIComponent(itemCode),{
    method:'PATCH',
    headers:headers,
    body:JSON.stringify({
      edit_data:editData,
      updated_at:new Date().toISOString()
    })
  }).then(function(r){
    if(r.status===406||r.status===404){
      // 不存在，插入新记录
      return fetch(SUPA_URL+'/rest/v1/item_edits',{
        method:'POST',
        headers:headers,
        body:JSON.stringify({
          item_code:itemCode,
          edit_data:editData,
          updated_at:new Date().toISOString()
        })
      });
    }
    return r;
  }).then(function(r){
    if(!r.ok){
      console.warn('Supabase保存失败:',r.status,r.statusText);
      return r.json().then(function(err){
        console.warn('错误详情:',err);
        throw new Error(err.message||'保存失败');
      });
    }
    return r;
  }).catch(function(e){
    console.error('Supabase保存异常:',e);
    useSupabase=false;
  });
}

function loadLocalEdits(){
  try{var s=localStorage.getItem(STORAGE_KEY);if(s)return JSON.parse(s);}catch(e){}
  return {};
}
function saveLocalEdits(edits){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(edits));}catch(e){}
}
function persistItem(it){
  var editData=JSON.parse(JSON.stringify(it));
  // 同时保存到localStorage和Supabase
  var edits=loadLocalEdits();
  edits[it.c]=editData;
  saveLocalEdits(edits);
  // 异步保存到Supabase
  saveEditToSupabase(it.c,editData);
}
function clearLocalEdits(){
  localStorage.removeItem(STORAGE_KEY);
  // 清除Supabase数据
  if(useSupabase&&SUPA_KEY){
    fetch(SUPA_URL+'/rest/v1/item_edits',{
      method:'DELETE',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
    }).catch(function(e){console.warn('Supabase清除失败:',e.message);});
  }
  toast('本地缓存已清除，重新加载原始数据','ok');
  loadData();
}
window.clearLocalEdits=clearLocalEdits;

function esc(s){if(!s)return '';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function toast(m,t){var e=document.getElementById('toast');e.textContent=m;e.className='toast show'+(t?' '+t:'');setTimeout(function(){e.className='toast';},2500);}

function getRegs(it){return it.regs||it.r||[];}
function getRegCount(it){var r=getRegs(it);return r?r.length:0;}

function loadData(){
  fetch('items_data.json').then(function(r){return r.json();}).then(function(d){
    // 异步加载编辑数据（优先Supabase，失败则localStorage）
    loadEditsFromSupabase().then(function(edits){
      var editCount=0;
      if(edits&&typeof edits==='object'){
        for(var i=0;i<d.length;i++){
          if(edits[d[i].c]){
            var keys=Object.keys(edits[d[i].c]);
            for(var k=0;k<keys.length;k++){
              if(keys[k]!=='c'&&keys[k]!=='n')d[i][keys[k]]=edits[d[i].c][keys[k]];
            }
            editCount++;
          }
        }
      }
      items=d;filtered=d.slice();
      var wc=0,wr=0,wf=0;
      for(var i=0;i<d.length;i++){
        if(d[i].sc&&d[i].sc.length)wc++;
        if(getRegCount(d[i])>0)wr++;
        if(d[i].f&&d[i].f.length)wf++;
      }
      document.getElementById('hStats').textContent='共 '+d.length+' 个事项 · 条件 '+wc+' · 法规 '+wr+' · 表单 '+wf+' · 材料 '+(d.reduce(function(s,i){return s+(i.materials?i.materials.length:0)},0));
      renderList();
      populateFilters();
      if(editCount>0) toast('已恢复 '+editCount+' 个事项的编辑数据'+(useSupabase?' (云端)':' (本地)'),'ok');
    }).catch(function(e){
      // 加载编辑数据失败，仍然加载原始数据
      items=d;filtered=d.slice();
      renderList();
      populateFilters();
    });
  }).catch(function(e){
    document.getElementById('iList').innerHTML='<div class="empty"><div class="et">数据加载失败: '+esc(e.message)+'</div></div>';
  });
}

function renderList(){
  var s=(page-1)*PS,e=s+PS,sub=filtered.slice(s,e);
  var h='';
  for(var i=0;i<sub.length;i++){
    var it=sub[i],gi=s+i;
    var hc=it.sc&&it.sc.length>0, hr=getRegCount(it)>0, hf=it.f&&it.f.length>0;
    var rc=getRegCount(it);
    var matC=it.materials?it.materials.length:0;
    var typeTag=it.item_type?'<span style="font-size:10px;padding:1px 5px;border-radius:8px;background:'+(it.item_type==='行政许可'?'#e3f2fd;color:#1565c0':it.item_type==='公共服务'?'#e8f5e9;color:#2e7d32':it.item_type==='行政给付'?'#fce4ec;color:#c62828':'#f3e5f5;color:#7b1fa2')+'">'+esc(it.item_type)+'</span>':'';
    h+='<div class="item-row'+(cur&&cur.c===it.c?' sel':'')+'" data-i="'+gi+'" role="option" onclick="sel('+gi+')">'
      +'<div class="iname">'+(typeTag?typeTag+' ':'')+esc(it.n)+'</div>'
      +'<div class="imeta">'
      +'<span class="'+(hc?'has':'')+'">'+(hc?'✓':'○')+' 条件'+(it.sc?it.sc.length:0)+'</span>'
      +'<span class="'+(hr?'has':'')+'">'+(hr?'✓':'○')+' 法规'+rc+'</span>'
      +'<span class="'+(matC?'has':'')+'">📄'+matC+'</span>'
      +'</div></div>';
  }
  document.getElementById('iList').innerHTML=h||'<div class="empty"><div class="et">无匹配事项</div></div>';
  renderPag();
}

function renderPag(){
  var t=filtered.length,p=Math.ceil(t/PS);
  if(p<=1){document.getElementById('pag').innerHTML='';return;}
  var h='<button '+(page<=1?'disabled':'')+' onclick="gp('+(page-1)+')">‹</button>';
  var rng=pRange(page,p);
  for(var i=0;i<rng.length;i++){
    if(rng[i]==='…')h+='<span style="padding:0 3px;font-size:11px">…</span>';
    else h+='<button class="'+(rng[i]===page?'cur':'')+'" onclick="gp('+rng[i]+')">'+rng[i]+'</button>';
  }
  h+='<button '+(page>=p?'disabled':'')+' onclick="gp('+(page+1)+')">›</button>';
  document.getElementById('pag').innerHTML=h;
}

function pRange(c,t){
  if(t<=7){var r=[];for(var i=1;i<=t;i++)r.push(i);return r;}
  var r=[1];if(c>3)r.push('…');
  for(var i=Math.max(2,c-1);i<=Math.min(t-1,c+1);i++)r.push(i);
  if(c<t-2)r.push('…');r.push(t);return r;
}

window.gp=function(p){page=p;renderList();};

function applyFilter(){
  var q=document.getElementById('sInput').value.trim().toLowerCase();
  var areaVal=document.getElementById('areaFilter').value;
  var typeVal=document.getElementById('typeFilter').value;
  filtered=[];
  for(var i=0;i<items.length;i++){
    var it=items[i];
    if(q&&it.n.toLowerCase().indexOf(q)<0&&(it.d||'').toLowerCase().indexOf(q)<0&&(it.c||'').toLowerCase().indexOf(q)<0&&(it.official_code||'').toLowerCase().indexOf(q)<0)continue;
    if(curF==='cond'&&(!it.sc||!it.sc.length))continue;
    if(curF==='reg'&&getRegCount(it)===0)continue;
    if(curF==='fld'&&(!it.f||!it.f.length))continue;
    if(areaVal&&it.area_name&&it.area_name.indexOf(areaVal)<0)continue;
    if(typeVal&&it.item_type!==typeVal&&it.item_type_full!==typeVal)continue;
    filtered.push(it);
  }
  page=1;renderList();
}

function populateFilters(){
  var areas={},types={};
  for(var i=0;i<items.length;i++){
    var it=items[i];
    // Extract district from area_name
    var area=it.area_name||'';
    var district='';
    if(area.indexOf('南山区')>=0) district='南山区';
    else if(area.indexOf('福田区')>=0) district='福田区';
    else if(area.indexOf('罗湖区')>=0) district='罗湖区';
    else if(area.indexOf('宝安区')>=0) district='宝安区';
    else if(area.indexOf('龙岗区')>=0) district='龙岗区';
    else if(area.indexOf('龙华区')>=0) district='龙华区';
    else if(area.indexOf('盐田区')>=0) district='盐田区';
    else if(area.indexOf('光明区')>=0) district='光明区';
    else if(area.indexOf('坪山区')>=0) district='坪山区';
    else if(area.indexOf('大鹏')>=0) district='大鹏新区';
    else if(area.indexOf('深汕')>=0) district='深汕合作区';
    else if(area.indexOf('前海')>=0) district='前海合作区';
    else if(area.indexOf('深圳市')>=0&&area.indexOf('区')<0) district='市本级';
    else district='其他';
    if(district) areas[district]=(areas[district]||0)+1;
    // Item type
    var tp=it.item_type||it.item_type_full||'';
    if(tp) types[tp]=(types[tp]||0)+1;
  }
  // Populate area dropdown
  var areaSel=document.getElementById('areaFilter');
  var areaOrder=['全部','市本级','南山区','福田区','罗湖区','宝安区','龙岗区','龙华区','盐田区','光明区','坪山区','大鹏新区','深汕合作区','前海合作区','其他'];
  // Remove existing options except first
  while(areaSel.options.length>1) areaSel.remove(1);
  for(var i=1;i<areaOrder.length;i++){
    var a=areaOrder[i];
    if(a==='全部') continue;
    if(areas[a]){
      var opt=document.createElement('option');
      opt.value=a;
      opt.textContent=a+' ('+areas[a]+')';
      areaSel.appendChild(opt);
    }
  }
  // Sort remaining by count
  var typeArr=Object.keys(types).sort(function(a,b){return types[b]-types[a];});
  var typeSel=document.getElementById('typeFilter');
  while(typeSel.options.length>1) typeSel.remove(1);
  for(var i=0;i<typeArr.length;i++){
    var opt=document.createElement('option');
    opt.value=typeArr[i];
    opt.textContent=typeArr[i]+' ('+types[typeArr[i]]+')';
    typeSel.appendChild(opt);
  }
}

document.getElementById('sInput').addEventListener('input',applyFilter);
document.getElementById('areaFilter').addEventListener('change',applyFilter);
document.getElementById('typeFilter').addEventListener('change',applyFilter);
var fBtns=document.querySelectorAll('.fbtn');
for(var i=0;i<fBtns.length;i++){
  fBtns[i].addEventListener('click',function(){
    for(var j=0;j<fBtns.length;j++)fBtns[j].classList.remove('on');
    this.classList.add('on');
    curF=this.getAttribute('data-f');
    applyFilter();
  });
}

window.sel=function(idx){
  cur=filtered[idx];curTab=0;
  for(var j=0;j<document.querySelectorAll('.item-row').length;j++){
    var el=document.querySelectorAll('.item-row')[j];
    el.classList.toggle('sel',parseInt(el.getAttribute('data-i'))===idx);
  }
  renderContent();
};

function renderContent(){
  if(!cur)return;
  var m=document.getElementById('mainArea');
  var sc=cur.sc?cur.sc.length:0, rc=getRegCount(cur), fc=cur.f?cur.f.length:0;
  var _nObj=cur.note?(typeof cur.note==='object'?cur.note:{other:cur.note}):{};
  var hasNote=!!(_nObj.pre||_nObj.post||_nObj.form_tip||_nObj.other);
  var matCnt=cur.materials?cur.materials.length:0;
  var resCnt=cur.results?cur.results.length:0;
  // Build info tags
  var infoTags=[];
  if(cur.item_type) infoTags.push(cur.item_type);
  if(cur.online_service==='是') infoTags.push('🌐 可网办');
  if(cur.exercise_level) infoTags.push('📍 '+cur.exercise_level);
  if(cur.is_cross_area==='是') infoTags.push('🔄 通办');
  var infoHtml=infoTags.length?'<div class="cnt-tags">'+infoTags.map(function(t){return '<span class="cnt-tag">'+esc(t)+'</span>';}).join('')+'</div>':'';
  var h='<div class="cnt-header">'
    +'<div class="cnt-title">'+esc(cur.n)+'</div>'
    +'<div class="cnt-sub">'+esc(cur.d||'未知部门')+(cur.s?' · '+esc(cur.s):'')+' · '+esc(cur.c)+'</div>'
    +infoHtml
    +'<div class="tabs">'
    +'<div class="tab'+(curTab===0?' on':'')+'" onclick="st(0)">基本信息</div>'
    +'<div class="tab'+(curTab===1?' on':'')+'" onclick="st(1)">受理条件<span class="bdg '+(sc?'bdg-y':'bdg-n')+'">'+sc+'</span></div>'
    +'<div class="tab'+(curTab===2?' on':'')+'" onclick="st(2)">政策依据<span class="bdg '+(rc?'bdg-y':'bdg-n')+'">'+rc+'</span></div>'
    +'<div class="tab'+(curTab===3?' on':'')+'" onclick="st(3)">申请表<span class="bdg '+(fc?'bdg-y':'bdg-n')+'">'+fc+'</span></div>'
    +'<div class="tab'+(curTab===4?' on':'')+'" onclick="st(4)">办事须知<span class="bdg '+(hasNote?'bdg-y':'bdg-n')+'">'+(hasNote?1:0)+'</span></div>'
    +'<div class="tab'+(curTab===5?' on':'')+'" onclick="st(5)">材料清单<span class="bdg '+(matCnt?'bdg-y':'bdg-n')+'">'+matCnt+'</span></div>'
    +'<div class="tab'+(curTab===6?' on':'')+'" onclick="st(6)">办事结果<span class="bdg '+(resCnt?'bdg-y':'bdg-n')+'">'+resCnt+'</span></div>'
    +'</div></div>';
  h+='<div class="tab-body">';
  if(curTab===0)h+=renderBasicInfo();
  else if(curTab===1)h+=renderCond();
  else if(curTab===2)h+=renderReg();
  else if(curTab===3)h+=renderFields();
  else if(curTab===4)h+=renderNote();
  else if(curTab===5)h+=renderMaterials();
  else h+=renderResults();
  h+='</div>';
  if(curTab===0||curTab===1||curTab===2||curTab===3||curTab===4){
    h+='<div class="act-bar">'
      +'<button class="btn" onclick="clearLocalEdits()">🗑️ 清除本地缓存</button>'
      +'<button class="btn" onclick="doExport()">📥 导出变更</button>'
      +'<button class="btn btn-p" onclick="doSave()">💾 保存到数据库</button>'
      +'</div>';
  }
  m.innerHTML=h;
}
window.renderContent=renderContent;

window.st=function(t){curTab=t;renderContent();};

/* === Tab 0: 基本信息 === */
function renderBasicInfo(){
  var it=cur;
  if(!it) return '';
  var h='';
  // 编辑模式按钮
  h+='<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px">'
    +'<button class="btn'+(basicInfoEditMode?' btn-p':'')+'" onclick="toggleBasicInfoEdit()">'+(basicInfoEditMode?'✅ 完成编辑':'✏️ 编辑基本信息')+'</button>'
    +'</div>';
  var groups=[
    {title:'📋 事项标识', rows:[
      ['行政区划', 'area_name', it.area_name],
      ['实施部门', 'dept_full_name', it.dept_full_name],

/* === Tab 1: 政策依据 === */
function syntaxHighlightJSON(obj,refNums){
  var json=JSON.stringify(obj,null,2);
  if(!refNums||!Object.keys(refNums).length) return esc(json);
  // Highlight lines containing referenced clause numbers
  var lines=json.split('\n');
  var result=[];
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    var isRef=false;
    for(var k in refNums){
      if(line.indexOf(k)>=0){isRef=true;break;}
    }
    if(isRef){
      result.push('<span class="json-highlight">'+esc(line)+'</span>');
    } else {
      result.push(esc(line));
    }
  }
  return result.join('\n');
}

  document.querySelectorAll('.reg-inp-cn').forEach(function(el){
    var ri=+el.dataset.ri, ci=+el.dataset.ci;
    if(cur.regs[ri]&&cur.regs[ri].ref_clauses&&cur.regs[ri].ref_clauses[ci]){
      cur.regs[ri].ref_clauses[ci].cn=el.value;
    }
  });
  document.querySelectorAll('.reg-inp-cc').forEach(function(el){
    var ri=+el.dataset.ri, ci=+el.dataset.ci;
    if(cur.regs[ri]&&cur.regs[ri].ref_clauses&&cur.regs[ri].ref_clauses[ci]){
      cur.regs[ri].ref_clauses[ci].cc=el.value;
    }
  });
  persistItem(cur);
  toast('已保存编辑（本地缓存，刷新后仍保留）','ok');
};

window.addRefClause=function(ri){
  if(!cur||!cur.regs||!cur.regs[ri])return;
  if(!cur.regs[ri].ref_clauses)cur.regs[ri].ref_clauses=[];
  cur.regs[ri].ref_clauses.push({cn:'',cc:''});
  persistItem(cur);
  renderContent();
};

window.delRefClause=function(ri,ci){
  if(!cur||!cur.regs||!cur.regs[ri])return;
  if(!confirm('确定删除此引用条款？'))return;
  cur.regs[ri].ref_clauses.splice(ci,1);
  persistItem(cur);
  renderContent();
};

window.exportRegJSON=function(){
  if(!cur)return;
  var regs=getRegs(cur);
  if(!regs)return;
  var data={
    item_code:cur.c,
    item_name:cur.n,
    dept:cur.d||'',
    regulations:regs.map(function(r){
      return {
        regulation_id:r.regulation_id||r.id||'',
        regulation_name:r.name||'',
        doc_number:r.number||r.num||'',
        issuing_authority:r.issuing_authority||r.authority||'',
        effective_date:r.effective_date||r.date||'',
        status:r.status||'',
        source_url:r.source_url||r.url||'',
        business_sector:r.business_sector||r.sector||'',
        department:r.department||r.dept||'',
        ref_clauses:r.ref_clauses||[],
        articles_count:(r.articles||[]).length
      };
    })
  };
  var d=JSON.stringify(data,null,2);

  a.href=u;a.download=cur.c+'_政策依据.json';a.click();
  URL.revokeObjectURL(u);

/* === Tab 2: 申请表 === */
function renderFields(){
  var it=cur;
  if(!it.f||!it.f.length)return '<div class="empty"><div class="ei">📄</div><div class="et">暂无申请表数据</div></div>';
  var h='';
  if(it.fn){
    h+='<div class="fm-info"><span><strong>表单：</strong>'+esc(it.fn)+'</span>';
    if(it.fid)h+='<span><strong>编号：</strong>'+esc(Array.isArray(it.fid)?it.fid.join(', '):it.fid)+'</span>';
    h+='<span><strong>字段数：</strong>'+it.f.length+'</span></div>';
  }
  // Collect unique values for filter dropdowns
  var typeSet={},stdSet={},entSet={},dimSet={};
  for(var i=0;i<it.f.length;i++){
    var f=it.f[i];
    typeSet[f.type||f.field_type||'text']=1;
    stdSet[f.std||f.standard_field||'']=1;
    entSet[f.ent||f.entity_type||'']=1;
    var dims=f.dimensions||f.dims||[];
    for(var di=0;di<dims.length;di++) dimSet[dims[di]]=1;
  }
  // Filter bar
  h+='<div class="field-filter-bar">'
    +'<div class="field-filter-group"><label>类型</label><select onchange="fieldFilter.type=this.value;renderContent()"><option value="">全部</option>';
  var tk=Object.keys(typeSet).sort();for(var ti=0;ti<tk.length;ti++) h+='<option value="'+tk[ti]+'"'+(fieldFilter.type===tk[ti]?' selected':'')+'>'+esc(TM[tk[ti]]||tk[ti])+'</option>';
  h+='</select></div>'
    +'<div class="field-filter-group"><label>标准字段</label><select onchange="fieldFilter.std=this.value;renderContent()"><option value="">全部</option>';
  var sk=Object.keys(stdSet).sort();for(var si=0;si<sk.length;si++){var sv=sk[si];if(!sv)continue;h+='<option value="'+esc(sv)+'"'+(fieldFilter.std===sv?' selected':'')+'>'+esc(sv)+'</option>';}
  h+='</select></div>'
    +'<div class="field-filter-group"><label>实体类型</label><select onchange="fieldFilter.ent=this.value;renderContent()"><option value="">全部</option>';
  var ek=Object.keys(entSet).sort();for(var ei=0;ei<ek.length;ei++){var ev=ek[ei];if(!ev)continue;h+='<option value="'+esc(ev)+'"'+(fieldFilter.ent===ev?' selected':'')+'>'+esc(ev)+'</option>';}
  h+='</select></div>'
    +'<div class="field-filter-group"><label>五维标注</label><select onchange="fieldFilter.dim=this.value;renderContent()"><option value="">全部</option>';
  var dims=['主体','客体','空间','凭证','载体'];for(var di=0;di<dims.length;di++){if(!dimSet[dims[di]])continue;h+='<option value="'+dims[di]+'"'+(fieldFilter.dim===dims[di]?' selected':'')+'>'+dims[di]+'</option>';}
  h+='</select></div>'
    +'<button class="btn field-filter-reset" onclick="fieldFilter={type:\'\',std:\'\',ent:\'\',dim:\'\'};renderContent()">重置</button>'
    +'</div>';
  // Table
  h+='<div class="ftbl-wrap"><table class="ftbl"><thead><tr>'
    +'<th style="width:36px">序号</th><th>字段名称</th><th style="width:76px">类型</th>'
    +'<th style="width:50px">必填</th><th style="width:90px">标准字段</th>'
    +'<th style="width:72px">实体类型</th><th style="min-width:100px">五维标注</th><th style="width:70px">操作</th>'
    +'</tr></thead><tbody>';
  var DM_META={'主体':{i:'👤',t:'主体 · 谁在办',d:'申请人身份信息，包括单位名称、联系人、电话、证件号等'},'客体':{i:'📋',t:'客体 · 为什么办',d:'申请事项的具体内容，包括标的、数量、规格、理由等'},'空间':{i:'📍',t:'空间 · 在哪办',d:'地点空间信息，包括地址、位置、面积、坐标等'},'凭证':{i:'📄',t:'凭证 · 凭什么办',d:'证件、材料、附件、合同编号等证明材料'},'载体':{i:'📝',t:'载体 · 办理记录',d:'行政流程痕迹，包括日期、签章、受理编号等'}};

  if(fieldFilter.type||fieldFilter.std||fieldFilter.ent||fieldFilter.dim){
    h+='<div style="text-align:center;padding:6px;font-size:11px;color:var(--t3)">筛选结果：'+shown+' / '+it.f.length+' 个字段</div>';

/* === Tab 3: 办事须知 === */
function getNoteObj(it){
  if(!it.note)return {pre:'',post:'',form_tip:'',other:''};
  if(typeof it.note==='object')return Object.assign({pre:'',post:'',form_tip:'',other:''},it.note);
  return {pre:'',post:'',form_tip:'',other:String(it.note)};
}
function renderNote(){
  var it=cur;
  var n=getNoteObj(it);
  var hasAny=n.pre||n.post||n.form_tip||n.other;
  var h='<div class="note-wrap">';
  if(!hasAny){
    h+='<div class="empty"><div class="ei">📝</div><div class="et">暂无办事须知</div><div class="es">点击下方按钮添加前置事项、后置结果、填表注意等信息</div></div>';
  } else {
    if(n.pre) h+='<div class="note-section"><div class="note-section-hd pre">🔗 前置事项</div><div class="note-section-body">'+esc(n.pre).replace(/\n/g,'<br>')+'</div></div>';
    if(n.post) h+='<div class="note-section"><div class="note-section-hd post">✅ 后置结果</div><div class="note-section-body">'+esc(n.post).replace(/\n/g,'<br>')+'</div></div>';
    if(n.form_tip) h+='<div class="note-section"><div class="note-section-hd form-tip">📋 填表注意</div><div class="note-section-body">'+esc(n.form_tip).replace(/\n/g,'<br>')+'</div></div>';
    if(n.other) h+='<div class="note-section"><div class="note-section-hd other">📌 其他说明</div><div class="note-section-body">'+esc(n.other).replace(/\n/g,'<br>')+'</div></div>';
  }
  h+='<div style="margin-top:16px;text-align:center">'
    +'<button class="btn btn-p" onclick="editNote()">✏️ '+(hasAny?'编辑办事须知':'添加办事须知')+'</button>'
    +'</div>';
  h+='</div>';
  return h;
}

window.saveF=function(idx){
  var f=cur.f[idx];
  f.name=document.getElementById('ef-n').value;
  f.type=document.getElementById('ef-t').value;
  f.req=document.getElementById('ef-r').value==='1';
  f.std=document.getElementById('ef-s').value;
  f.ent=document.getElementById('ef-e').value;
  var ov=document.getElementById('ef-o').value.trim();
  f.opts=(ov&&f.type==='select')?ov.split(/[,，]/).map(function(s){return s.trim();}).filter(Boolean):null;

  if(!localEdits[cur.c])localEdits[cur.c]={fields:{}};
  localEdits[cur.c].fields[idx]=true;
  persistItem(cur);
  closeM();renderContent();toast('字段已更新（本地缓存）','ok');

/* === Save to Supabase === */
window.doSave=function(){
  if(!cur)return;
  toast('正在保存…','');
  var headers={'apikey':SUPA_KEY,'Content-Type':'application/json','Authorization':'Bearer '+SUPA_KEY};
  var proms=[];
  // Save form fields if on fields tab and fields exist
  if(cur.f&&cur.f.length){
    var fids=Array.isArray(cur.fid)?cur.fid:[cur.fid];
    for(var fi=0;fi<fids.length;fi++){
      var fid=fids[fi];
      if(!fid)continue;
      // Query existing records
      proms.push(
        fetch(SUPA_URL+'/rest/v1/form_fields?form_id=eq.'+encodeURIComponent(fid),{headers:headers})
        .then(function(r){return r.json();})
        .then(function(rows){
          var byName={};
          for(var j=0;j<rows.length;j++){
            var key=(rows[j].field_name||'')+'__'+(rows[j].field_index||j);
            byName[key]=rows[j].id;
          }
          var ups=[];
          for(var k=0;k<cur.f.length;k++){
            var f=cur.f[k];
            var key2=(f.name||f.field_name||'')+'__'+k;
            var rec={
              field_name:f.name||f.field_name||'',
              field_type:f.type||f.field_type||'text',
              required:f.req||f.required||false,
              standard_field:f.std||f.standard_field||null,
              entity_type:f.ent||f.entity_type||null,
              field_index:k
            };
            if(f.opts)rec.options=f.opts;
            if(byName[key2]){
              // Update existing
              ups.push(fetch(SUPA_URL+'/rest/v1/form_fields?id=eq.'+byName[key2],{
                method:'PATCH',headers:headers,
                body:JSON.stringify(rec)
              }));
            }
          }
          return Promise.all(ups);
        })
      );
    }
  }
  Promise.all(proms).then(function(){
    toast('已保存到数据库','ok');
  }).catch(function(e){
    toast('保存失败: '+e.message,'err');
  });
};

/* === Dimension tooltip (fixed position, avoids overflow clipping) === */
(function(){
  var tip=document.getElementById('dim-tip');
  if(!tip)return;
  var showTip=function(e){
    var el=e.target.closest('.dtag');
    if(!el||!el.dataset.title){tip.style.opacity='0';return;}
    tip.innerHTML='<div class="dt-title">'+el.dataset.title+'</div><div class="dt-desc">'+el.dataset.desc+'</div>';
    tip.style.opacity='1';
    var r=el.getBoundingClientRect();
    requestAnimationFrame(function(){
      var tw=tip.offsetWidth,th=tip.offsetHeight;
      var left=r.left+r.width/2-tw/2;
      var top=r.top-th-10;
      if(left<8)left=8;
      if(left+tw>window.innerWidth-8)left=window.innerWidth-tw-8;
      if(top<8){top=r.bottom+10;tip.style.transform='none';}
      tip.style.left=left+'px';
      tip.style.top=top+'px';
    });
  };
  var hideTip=function(){tip.style.opacity='0';};
  document.addEventListener('mouseover',showTip);
  document.addEventListener('mouseout',function(e){
    if(!e.target.closest('.dtag'))hideTip();
  });
})();

loadData();
})();
